<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141128" />
      <stop offset="60%" stop-color="#0a0a12" />
      <stop offset="100%" stop-color="#06060a" />
    </radialGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="25%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- V Left Arm Gradient -->
    <linearGradient id="vLeftGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#60a5fa" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- V Right Arm Gradient -->
    <linearGradient id="vRightGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Inner Gloss Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Container with Soft Glow -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGlow)" />
  
  <!-- Outer Glowing Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="100" stroke="url(#neonBorder)" stroke-width="7" filter="url(#subtleGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="100" stroke="url(#neonBorder)" stroke-width="3" opacity="0.9" />

  <!-- Ambient Central Purple Glow -->
  <circle cx="256" cy="240" r="140" fill="#7e22ce" opacity="0.15" filter="url(#softGlow)" />

  <!-- The Geometric "V" Emblem -->
  <!-- Left Main Arm of V -->
  <path
    d="M 132 108
       L 194 130
       L 272 328
       C 278 344 268 360 252 360
       C 242 360 234 354 228 342
       L 132 108 Z"
    fill="url(#vLeftGrad)"
    filter="url(#subtleGlow)"
  />

  <!-- Left Arm Highlight/Specular Gloss -->
  <path
    d="M 148 122
       L 186 135
       L 254 322
       C 256 328 252 334 246 334
       C 242 334 238 330 236 324
       L 148 122 Z"
    fill="url(#glossGrad)"
    opacity="0.6"
  />

  <!-- Right Arm of V -->
  <path
    d="M 378 108
       L 316 130
       L 242 284
       L 290 304
       L 378 108 Z"
    fill="url(#vRightGrad)"
    filter="url(#subtleGlow)"
  />

  <!-- Right Arm Specular Streak -->
  <path
    d="M 364 122
       L 326 136
       L 266 270
       L 292 280
       L 364 122 Z"
    fill="url(#glossGrad)"
    opacity="0.5"
  />

  <!-- "VYBE" Wordmark Typography -->
  <g fill="#ffffff" filter="url(#subtleGlow)">
    <!-- V -->
    <path d="M 134 402 L 149 402 L 165 435 L 181 402 L 196 402 L 173 446 L 157 446 Z" />
    
    <!-- Y -->
    <path d="M 215 402 L 230 402 L 243 423 L 256 402 L 271 402 L 250 431 L 250 446 L 236 446 L 236 431 Z" />
    
    <!-- B -->
    <path d="M 292 402 L 320 402 C 328 402 334 406 334 412 C 334 417 330 421 324 423 C 332 425 336 430 336 436 C 336 443 329 446 320 446 L 292 446 Z M 306 412 L 306 419 L 318 419 C 321 419 323 417 323 415 C 323 413 321 412 318 412 Z M 306 429 L 306 436 L 319 436 C 322 436 325 434 325 432 C 325 430 322 429 319 429 Z" />
    
    <!-- E - 3 Modern Bars -->
    <rect x="358" y="402" width="34" height="8" rx="2" fill="#ffffff" />
    <rect x="358" y="421" width="34" height="8" rx="2" fill="#ffffff" />
    <rect x="358" y="440" width="34" height="8" rx="2" fill="#f43f5e" />
  </g>
</svg>
